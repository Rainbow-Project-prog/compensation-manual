name: bridge-ci

on:
  push:
    paths:
      - 'lpro-telegram-bridge/**'
      - '.github/workflows/bridge-ci.yml'
  pull_request:
    paths:
      - 'lpro-telegram-bridge/**'
      - '.github/workflows/bridge-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lpro-telegram-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lpro-telegram-bridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
